<!DOCTYPE html>
<html layout:decorate="~{layout}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title th:text="${video.title} + ' - 视频共享平台'">视频详情 - 视频共享平台</title>
</head>

<div layout:fragment="content">
    <div class="container">
        <div class="row">
            <div class="col-md-8">
                <!-- 视频播放器 -->
                <div class="card video-card glass-panel border-0 overflow-hidden">
                    <div class="card-body p-0">
                        <video 
                            controls 
                            class="w-100" 
                            style="max-height: 500px;"
                            th:poster="@{'/thumbnails/' + ${video.id}}"
                            preload="metadata">
                            <source th:src="@{'/stream/' + ${video.id}}" type="video/mp4">
                            您的浏览器不支持视频播放。
                        </video>
                    </div>
                </div>

                <!-- 视频信息 -->
                <div class="card glass-panel mt-4">
                    <div class="card-body">
                        <h2 th:text="${video.title}">视频标题</h2>
                        <div class="row mt-3">
                            <div class="col-md-6">
                                <p class="text-muted mb-1">
                                    <i class="bi bi-eye"></i> 
                                    <span th:text="${video.viewsTotal}">0</span> 次播放
                                </p>
                                <p class="text-muted mb-1">
                                    <i class="bi bi-download"></i> 
                                    <span th:text="${video.downloadsTotal}">0</span> 次下载
                                </p>
                            </div>
                            <div class="col-md-6 text-end">
                                <p class="text-muted mb-1">
                                    <i class="bi bi-clock"></i> 
                                    上传时间：<span th:text="${#temporals.format(video.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01 12:00</span>
                                </p>
                                <p class="text-muted mb-1">
                                    <i class="bi bi-stopwatch"></i> 
                                    时长：<span th:text="${video.durationSeconds >= 60 ? (video.durationSeconds / 60) + ' 分 ' + (video.durationSeconds % 60) + ' 秒' : video.durationSeconds + ' 秒'}">0 秒</span>
                                </p>
                            </div>
                        </div>
                        
                        <hr>
                        
                        <div class="row">
                            <div class="col-md-12">
                                <h5>视频描述</h5>
                                <p th:text="${video.description != null ? video.description : '暂无描述'}" class="text-break">
                                    暂无描述
                                </p>
                            </div>
                        </div>

                        <div th:if="${video.keywords != null and !#strings.isEmpty(video.keywords)}" class="mt-3">
                            <h6>标签</h6>
                            <span th:each="keyword : ${#strings.listSplit(video.keywords, ',')}" 
                                  class="badge bg-secondary me-1" 
                                  th:text="${#strings.trim(keyword)}">标签</span>
                        </div>

                        <div class="mt-3">
                            <a th:href="@{'/download/' + ${video.id}}" 
                               class="btn btn-gradient me-2">
                                <i class="bi bi-download"></i> 下载视频
                            </a>
                            <a href="/" class="btn btn-outline-primary">
                                <i class="bi bi-arrow-left"></i> 返回首页
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <!-- 交互式笔记（创新功能） -->
                <div class="card glass-panel mb-3" sec:authorize="isAuthenticated()">
                    <div class="card-header bg-transparent border-bottom border-white border-opacity-10">
                        <h5 class="mb-0"><i class="bi bi-journal-text"></i> 我的视频笔记</h5>
                    </div>
                    <div class="card-body">
                        <!-- 笔记输入框 -->
                        <div class="mb-3">
                            <textarea id="noteContent" class="form-control" rows="3" 
                                      placeholder="在这里记录笔记...点击'记笔记'将锚定当前播放时间点"></textarea>
                            <button id="addNoteBtn" class="btn btn-gradient btn-sm mt-2 w-100">
                                <i class="bi bi-plus-circle"></i> 记笔记
                            </button>
                        </div>
                        
                        <!-- 笔记列表 -->
                        <div id="notesList" class="notes-list" style="max-height: 400px; overflow-y: auto;">
                            <div class="text-muted text-center py-3">暂无笔记</div>
                        </div>
                    </div>
                </div>
                
                <!-- 相关视频 -->
                <div class="card glass-panel">
                    <div class="card-header bg-transparent border-bottom border-white border-opacity-10">
                        <h5 class="mb-0"><i class="bi bi-collection-play"></i> 推荐视频</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${relatedVideos == null or relatedVideos.isEmpty()}" class="text-muted text-center">
                            暂无推荐视频
                        </div>
                        <div th:each="relatedVideo : ${relatedVideos}" class="mb-3" th:if="${relatedVideos != null}">
                            <div class="row">
                                <div class="col-4">
                                    <img th:src="@{'/thumbnails/' + ${relatedVideo.id}}" 
                                         class="img-fluid rounded" 
                                         style="aspect-ratio: 16/9; object-fit: cover;">
                                </div>
                                <div class="col-8">
                                    <a th:href="@{'/videos/' + ${relatedVideo.id}}" 
                                       class="text-decoration-none">
                                        <h6 th:text="${relatedVideo.title}" 
                                            class="mb-1 text-truncate">视频标题</h6>
                                    </a>
                                    <small class="text-muted">
                                        <i class="bi bi-eye"></i> 
                                        <span th:text="${relatedVideo.viewsTotal}">0</span> 次播放
                                    </small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 视频统计 -->
                <div class="card mt-3">
                    <div class="card-header">
                        <h5><i class="bi bi-bar-chart"></i> 视频统计</h5>
                    </div>
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-6">
                                <h4 class="text-primary" th:text="${video.viewsTotal}">0</h4>
                                <small class="text-muted">播放次数</small>
                            </div>
                            <div class="col-6">
                                <h4 class="text-success" th:text="${video.downloadsTotal}">0</h4>
                                <small class="text-muted">下载次数</small>
                            </div>
                        </div>
                        <hr>
                        <div class="row text-center">
                            <div class="col-6">
                                <h5 class="text-info" th:text="${#numbers.formatDecimal(video.sizeBytes / 1024 / 1024, 1, 2)} + ' MB'">0 MB</h5>
                                <small class="text-muted">文件大小</small>
                            </div>
                            <div class="col-6">
                                <h5 class="text-warning" th:text="${video.durationSeconds >= 60 ? (video.durationSeconds / 60) + ' 分 ' + (video.durationSeconds % 60) + ' 秒' : video.durationSeconds + ' 秒'}">0 分钟</h5>
                                <small class="text-muted">视频时长</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="styles">
    <style>
        .video-player {
            border-radius: var(--border-radius);
            overflow: hidden;
        }
        
        .video-info-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
        }
        
        .video-meta .badge {
            background: var(--primary-color) !important;
        }
        
        .note-item {
            padding: 10px;
            margin-bottom: 8px;
            border-left: 3px solid var(--primary-color);
            background: rgba(255, 255, 255, 0.7);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .note-item:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateX(5px);
        }
        
        .note-timestamp {
            font-weight: bold;
            color: var(--primary-color);
        }
    </style>
</th:block>

<th:block layout:fragment="scripts">
    <script th:inline="javascript">
        /*<![CDATA[*/
        const videoId = /*[[${video.id}]]*/ 0;
        const videoPlayer = document.querySelector('video');
        const addNoteBtn = document.getElementById('addNoteBtn');
        const noteContent = document.getElementById('noteContent');
        const notesList = document.getElementById('notesList');
        
        // 加载笔记
        function loadNotes() {
            fetch(`/api/notes/video/${videoId}/my`)
                .then(res => res.json())
                .then(notes => {
                    if (notes.length === 0) {
                        notesList.innerHTML = '<div class="text-muted text-center py-3">暂无笔记</div>';
                        return;
                    }
                    
                    notesList.innerHTML = notes.map(note => `
                        <div class="note-item" data-timestamp="${note.timestampSeconds}">
                            <div class="note-timestamp">
                                <i class="bi bi-clock"></i> ${formatTime(note.timestampSeconds)}
                            </div>
                            <div class="note-content small mt-1">${escapeHtml(note.content)}</div>
                        </div>
                    `).join('');
                    
                    // 绑定点击事件
                    document.querySelectorAll('.note-item').forEach(item => {
                        item.addEventListener('click', function() {
                            const timestamp = parseInt(this.dataset.timestamp);
                            videoPlayer.currentTime = timestamp;
                            videoPlayer.play();
                        });
                    });
                })
                .catch(err => console.error('加载笔记失败:', err));
        }
        
        // 添加笔记
        addNoteBtn.addEventListener('click', function() {
            const content = noteContent.value.trim();
            if (!content) {
                alert('请输入笔记内容');
                return;
            }
            
            const timestamp = Math.floor(videoPlayer.currentTime);
            
            fetch('/api/notes', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    videoId: videoId,
                    timestampSeconds: timestamp,
                    content: content
                })
            })
            .then(res => {
                if (res.ok) {
                    noteContent.value = '';
                    loadNotes();
                } else {
                    alert('添加笔记失败');
                }
            })
            .catch(err => console.error('添加笔记失败:', err));
        });
        
        // 格式化时间
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }
        
        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 页面加载时加载笔记
        loadNotes();
        /*]]>*/
    </script>
</th:block>

</html>
